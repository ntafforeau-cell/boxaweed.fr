/* ===== STYLE GENERAL ===== */

/* ===== BOUTONS BLANC FOND / TEXTE NOIR ===== */

  color:#000;

  padding:15px 30px;
  margin:15px 10px;

}

}

/* ===== LOGO ===== */
.logo{

}

/* ===== HAMBURGER ===== */
.hamburger{
  position:fixed;

  padding:8px;

}

.hamburger div{

}

/* ===== MENU ===== */

  border:1px solid #444;

/* ===== INTRO ===== */

}

/* ===== COMMANDE ===== */

  max-width:600px;
  padding:0 20px;
}

/* ===== BANDE DEFILANTE ===== */
.bande-wrapper{
  overflow-x:auto;
  white-space:nowrap;
  width:100%;
  margin:40px 0;
}

.bande-defilante{
  display:flex;
}

.bande-defilante img{
  width:150px;
  height:150px;
  object-fit:cover;
  margin-right:15px;
  cursor:pointer;
}

/* ===== CREATIONS ===== */
#creations{
  display:none;
  padding:40px 20px;
}

#creations img{

  height:200px;
  margin:15px;

  cursor:pointer;
}

/* ===== BOUTIQUE ===== */
#boutique{

  padding:40px 20px;
}

.produit{

.modal-main{

  max-width:90%;
}

.miniatures img{
  width:60px;
  height:60px;
  margin:5px;
  cursor:pointer;
}

/* ===== SOCIAL ===== */
.social-boutique{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  margin:40px 0;
}

.social-boutique img{
  width:50px;
}

/* ===== YOUTUBE ===== */
.youtube iframe{
  width:90%;
  max-width:400px;
  height:225px;
}

/* ===== MODAL ===== */
#imageModal{
  display:none;
  position:fixed;
  z-index:2000;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}

#imageModal img{
  max-width:95%;
  max-height:95%;
}

#closeModal{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  cursor:pointer;
}

<script>

function toggleMenu(){
let menu=document.getElementById("menuHamburger");
menu.style.display=(menu.style.display==="block")?"none":"block";
}

function toggleCreations(){
let section=document.getElementById("creations");
section.style.display=(section.style.display==="block")?"none":"block";
}

function toggleBoutique(){
let section=document.getElementById("boutique");
section.style.display=(section.style.display==="block")?"none":"block";
}

function scrollToSection(id){
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function openModal(img){
document.getElementById("imageModal").style.display="flex";
document.getElementById("modalImg").src=img.src;
}

function closeModal(){
document.getElementById("imageModal").style.display="none";
}

function changeImage(mainId,element){
document.getElementById(mainId).src=element.src;
}

const bande=document.getElementById('bandeDefilante');

let scrollAmount=0;

function autoScroll(){

scrollAmount+=0.5;

if(scrollAmount>=bande.scrollWidth/2){

scrollAmount=0;

}

bande.parentElement.scrollLeft=scrollAmount;

requestAnimationFrame(autoScroll);

}

autoScroll();

</script>
