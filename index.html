<!DOCTYPE html><html lang="fr">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BOXAWEED</title><style>

body{
margin:0;
background:black;
color:white;
font-family:Arial, sans-serif;
overflow-x:hidden;
}

/* LOGO */
.logo{
position:absolute;
top:20px;
left:20px;
z-index:1001;
}

.logo img{
height:60px;
}

/* HAMBURGER */
.hamburger{
position:fixed;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
z-index:1002;
}

.menu{
position:fixed;
top:0;
right:-250px;
width:250px;
height:100%;
background:black;
padding-top:80px;
transition:0.3s;
z-index:1001;
}

.menu a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.menu a:hover{
background:#111;
}

.menu.open{
right:0;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:40px;
margin-bottom:20px;
}

.button{
padding:15px 30px;
border:2px solid white;
background:none;
color:white;
cursor:pointer;
margin-top:20px;
}

.button:hover{
background:white;
color:black;
}

/* YOUTUBE */
.video-container{
position:relative;
width:100%;
max-width:400px;
aspect-ratio:9/16;
margin:auto;
}

.video-container iframe{
width:100%;
height:100%;
border:none;
}

/* BANDE DEFILANTE */
.bande-defilante{
overflow:hidden;
white-space:nowrap;
margin:40px 0;
}

.bande-defilante .track{
display:inline-block;
animation:defile 40s linear infinite;
}

.bande-defilante img{
height:150px;
margin:10px;
cursor:pointer;
}

@keyframes defile{
0%{transform:translateX(0);} 
100%{transform:translateX(-50%);} 
}

/* GALERIES */
.section{
padding:40px;
text-align:center;
}

.galerie{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.galerie img{
width:250px;
margin:10px;
cursor:pointer;
}

/* FULLSCREEN */
#fullscreenViewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
justify-content:center;
align-items:center;
z-index:9999;
}

#fullscreenViewer img{
max-width:95%;
max-height:95%;
}

</style></head>

<img src="boite11.jpg">
<img src="boite12.jpg"></div></div><!-- FULLSCREEN --><div id="fullscreenViewer" onclick="closeFullscreen()">
<img id="fullscreenImage">
</div><script>

function toggleMenu(){

const menu = document.getElementById("menu");
menu.classList.toggle("open");

}

function contact(){

window.location.href="mailto:ntafforeau@gmail.com";

}

let currentImages=[];
let currentIndex=0;
let startX=0;
let endX=0;

function openFullscreen(src, array){

currentImages=array;
currentIndex=array.indexOf(src);

document.getElementById("fullscreenImage").src=src;
document.getElementById("fullscreenViewer").style.display="flex";

}

function closeFullscreen(){

document.getElementById("fullscreenViewer").style.display="none";

}

function nextImage(){

currentIndex++;

if(currentIndex>=currentImages.length)
currentIndex=0;

document.getElementById("fullscreenImage").src=currentImages[currentIndex];

}

function prevImage(){

currentIndex--;

if(currentIndex<0)
currentIndex=currentImages.length-1;

document.getElementById("fullscreenImage").src=currentImages[currentIndex];

}

// CLICK IMAGES

function enableGallery(selector){

const imgs=document.querySelectorAll(selector);
const array=[...imgs].map(img=>img.src);

imgs.forEach(img=>{
img.onclick=()=>openFullscreen(img.src,array);
});

}

enableGallery(".galerie img");
enableGallery(".bande-defilante img");

// SWIPE

const viewer=document.getElementById("fullscreenViewer");

viewer.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

viewer.addEventListener("touchend",e=>{

endX=e.changedTouches[0].clientX;

if(startX-endX>50)nextImage();
if(endX-startX>50)prevImage();

});

// KEYBOARD

document.addEventListener("keydown",e=>{

if(viewer.style.display==="flex"){

if(e.key==="ArrowRight")nextImage();
if(e.key==="ArrowLeft")prevImage();
if(e.key==="Escape")closeFullscreen();

}

});

</script></body>
