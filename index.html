<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxaweed</title>

<style>

/* ===== STYLE GENERAL ===== */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

/* ===== BOUTONS BLANCS BRILLANTS ===== */
button{
  background:linear-gradient(180deg,#ffffff,#eaeaea);
  color:#000;
  border:none;
  padding:12px 25px;
  margin:10px;
  cursor:pointer;
  border-radius:6px;
  box-shadow:
    0 0 10px rgba(255,255,255,0.6),
    inset 0 1px 0 rgba(255,255,255,0.9);
  font-weight:bold;
}

button:hover{
  background:linear-gradient(180deg,#ffffff,#dddddd);
  box-shadow:
    0 0 15px rgba(255,255,255,0.9),
    inset 0 1px 0 rgba(255,255,255,1);
}

/* ===== LOGO ===== */
.logo{
  width:150px;
  margin-top:10px;
}

/* ===== HAMBURGER BLANC BRILLANT ===== */
.hamburger{
  position:fixed;
  top:10px;
  right:10px;
  z-index:1000;
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  background:linear-gradient(180deg,#ffffff,#eaeaea);
  box-shadow:
    0 0 12px rgba(255,255,255,0.8),
    inset 0 1px 0 rgba(255,255,255,1);
}

.hamburger div{
  width:30px;
  height:4px;
  background:#000;
  margin:5px;
  border-radius:2px;
}

/* ===== MENU ===== */
.menu{
  display:none;
  position:fixed;
  top:60px;
  right:10px;
  background:#111;
  border:1px solid #444;
  padding:10px;
  z-index:999;
}

/* ===== INTRO ===== */
#intro{
  max-width:600px;
  margin:60px auto 20px;
  padding:0 20px;
}
#intro p{
  text-shadow:0 0 3px #fff;
}

/* ===== BANDE DEFILANTE ===== */
.bande-wrapper{
  overflow-x:auto;
  width:100%;
  margin:20px 0;
}
.bande-defilante{
  display:flex;
  width:max-content;
}
.bande-defilante img{
  width:150px;
  height:150px;
  object-fit:cover;
  margin-right:10px;
  cursor:pointer;
  transition:0.3s;
}
.bande-defilante img:hover{
  transform:scale(1.1);
}

/* ===== CREATIONS ===== */
#creations{
  display:none;
  padding:20px;
}
#creations img{
  width:200px;
  height:200px;
  object-fit:cover;
  margin:10px;
  cursor:pointer;
}

/* ===== BOUTIQUE ===== */
#boutique{
  display:none;
  padding:20px;
}
.produit{
  margin-bottom:40px;
  border-bottom:1px solid #444;
  padding-bottom:20px;
}
.produit img{
  cursor:pointer;
}
.modal-main{
  width:300px;
  max-width:90%;
  margin-bottom:10px;
}
.miniatures img{
  width:60px;
  height:60px;
  margin:5px;
  cursor:pointer;
  transition:0.3s;
}
.miniatures img:hover{
  transform:scale(1.2);
}

/* ===== INSTAGRAM ===== */
.insta{
  width:50px;
  margin:20px;
}

/* ===== YOUTUBE ===== */
.youtube iframe{
  width:90%;
  max-width:400px;
  height:225px;
}

/* ===== MODAL IMAGE ===== */
#imageModal{
  display:none;
  position:fixed;
  z-index:2000;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
}
#imageModal img{
  max-width:95%;
  max-height:95%;
}
#closeModal{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  cursor:pointer;
}

</style>
</head>
<body>

<!-- LOGO -->
<img src="Boxaweedsite/logo.png" class="logo">

<!-- HAMBURGER -->
<div class="hamburger" onclick="toggleMenu()">
  <div></div>
  <div></div>
  <div></div>
</div>

<div class="menu" id="menuHamburger">
  <button onclick="scrollToSection('commande')">Créer ma boîte</button>
  <button onclick="toggleCreations()">Mes Créations</button>
  <button onclick="toggleBoutique()">Ma Boutique</button>
  <button onclick="window.location.href='https://www.instagram.com/boxaweed'">
    <img src="Boxaweedsite/logoinsta.png" class="insta">
  </button>
  <button onclick="scrollToSection('youtube')">Vidéo YouTube</button>
</div>

<!-- RESTE DU CODE IDENTIQUE -->
<!-- (je n’ai rien changé d’autre) -->

<!-- INSTAGRAM -->
<a href="https://www.instagram.com/boxaweed">
  <img src="Boxaweedsite/logoinsta.png" class="insta">
</a>

<!-- YOUTUBE -->
<div id="youtube" class="youtube">
  <iframe src="https://www.youtube.com/embed/AR4yD9GrbuM" allowfullscreen></iframe>
</div>

<!-- MODAL -->
<div id="imageModal" onclick="closeModal()">
  <span id="closeModal">&times;</span>
  <img id="modalImg">
</div>

<!-- FOOTER -->
<footer>Boxaweed 2026®️</footer>

<script>
function toggleMenu(){
  let menu=document.getElementById("menuHamburger");
  menu.style.display=(menu.style.display==="block")?"none":"block";
}
function toggleCreations(){
  let section=document.getElementById("creations");
  section.style.display=(section.style.display==="block")?"none":"block";
}
function toggleBoutique(){
  let section=document.getElementById("boutique");
  section.style.display=(section.style.display==="block")?"none":"block";
}
function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
function openModal(img){
  document.getElementById("imageModal").style.display="flex";
  document.getElementById("modalImg").src=img.src;
}
function closeModal(){
  document.getElementById("imageModal").style.display="none";
}
function changeImage(mainId,element){
  document.getElementById(mainId).src=element.src;
}
</script>

</body>
</html>
