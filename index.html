<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxaweed</title>

<style>

/* ===== STYLE GENERAL ===== */

body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

h1,h2,h3 { margin:10px 0; }

p { margin:5px 0; }

a { color:#fff; text-decoration:none; }


/* ===== LOGO ===== */

.logo {
  width:150px;
  margin-top:10px;
}


/* ===== HAMBURGER ===== */

.hamburger {
  position:fixed;
  top:10px;
  right:10px;
  cursor:pointer;
  z-index:1000;
}

.hamburger div {
  width:30px;
  height:4px;
  background:#fff;
  margin:5px;
}


/* ===== MENU ===== */

.menu {
  display:none;
  position:fixed;
  top:50px;
  right:10px;
  background:#111;
  border:1px solid #444;
  padding:10px;
  z-index:999;
}

.menu button {
  display:block;
  margin:5px 0;
}


/* ===== INTRO ===== */

#intro {
  max-width:600px;
  margin:60px auto 20px;
  padding:0 20px;
}

#intro p {
  text-shadow:0 0 3px #fff;
}


/* ===== BOUTON COMMANDE ===== */

#commande {
  margin:20px auto;
  max-width:600px;
}

#commande button {
  margin-top:15px;
  background:#000;
  color:#fff;
  border:none;
  padding:12px 25px;
  cursor:pointer;
}

#commande button:hover {
  background:#444;
}


/* ===== BANDE DEFILANTE ===== */

.bande-wrapper {
  overflow:hidden;
  width:100%;
  margin:20px 0;
}

.bande-defilante {
  display:flex;
  width:max-content;
  animation:defilement 40s linear infinite;
}

.bande-defilante img {

  width:150px;
  height:150px;
  object-fit:cover;
  margin-right:10px;
  cursor:pointer;
  transition:0.3s;
}

.bande-defilante img:hover {
  transform:scale(1.1);
}

@keyframes defilement {

  from {
    transform:translateX(0);
  }

  to {
    transform:translateX(-50%);
  }

}


/* ===== CREATIONS ===== */

#creations {

  display:none;
  padding:20px;
}

#creations img {

  width:200px;
  height:200px;
  object-fit:cover;
  margin:10px;
  cursor:pointer;
  transition:0.3s;
}

#creations img:hover {

  transform:scale(1.05);
}


/* ===== BOUTIQUE ===== */

#boutique {

  display:none;
  padding:20px;
}

.modal-main {

  width:300px;
  max-width:90%;
}

.miniatures img {

  width:50px;
  height:50px;
  cursor:pointer;
}


/* ===== INSTAGRAM ===== */

.insta {

  width:50px;
  margin:20px;
}


/* ===== YOUTUBE ===== */

.youtube iframe {

  width:90%;
  max-width:400px;
  height:225px;
}


/* ===== MODAL PLEIN ECRAN ===== */

#imageModal {

  display:none;

  position:fixed;

  z-index:2000;

  left:0;

  top:0;

  width:100%;

  height:100%;

  background:rgba(0,0,0,0.95);

  justify-content:center;

  align-items:center;

}

#imageModal img {

  max-width:95%;

  max-height:95%;

}

#closeModal {

  position:absolute;

  top:20px;

  right:30px;

  font-size:40px;

  color:#fff;

  cursor:pointer;

}

</style>
</head>

<!-- JS -->

<script>

function toggleMenu(){

const menu=document.getElementById("menuHamburger");

menu.style.display=(menu.style.display==="block")?"none":"block";

}

function scrollToSection(id){

document.getElementById(id).scrollIntoView({behavior:"smooth"});

}

function toggleCreations(){

const section=document.getElementById("creations");

section.style.display=(section.style.display==="block")?"none":"block";

}

function toggleBoutique(){

const section=document.getElementById("boutique");

section.style.display=(section.style.display==="block")?"none":"block";

}


/* MODAL */

function openModal(img){

document.getElementById("imageModal").style.display="flex";

document.getElementById("modalImg").src=img.src;

}

function closeModal(){

document.getElementById("imageModal").style.display="none";

}

</script>
