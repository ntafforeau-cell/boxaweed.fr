<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boxaweed</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial, sans-serif;
text-align:center;
overflow-x:hidden;
}

/* LOGO */

.logo{
width:220px;
margin-top:20px;
}

/* TEXTE IMMERSIF */

.intro{
font-size:28px;
margin:30px 20px;
opacity:0;
animation:introFade 2s ease forwards;
text-shadow:0 0 6px white;
}

@keyframes introFade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* BOUTONS */

.button{
display:block;
margin:20px auto;
padding:15px 30px;
border:2px solid white;
background:black;
color:white;
font-size:20px;
cursor:pointer;
width:220px;
}

.button:hover{
background:white;
color:black;
}

/* HAMBURGER */

.hamburger{
position:fixed;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
z-index:1000;
}

.menu{
display:none;
position:fixed;
top:60px;
right:20px;
background:black;
border:1px solid white;
padding:10px;
}

.menu a{
display:block;
color:white;
text-decoration:none;
margin:10px;
}

/* GALERIE CREATIONS */

.creations{
display:none;
flex-direction:column;
align-items:center;
}

.creations img{
width:90%;
max-width:500px;
margin:15px;
cursor:pointer;
}

/* BANDE FILANTE */

.scroll-container{
overflow:hidden;
white-space:nowrap;
margin-top:20px;
}

.scroll{
display:inline-block;
animation:scroll 40s linear infinite;
}

.scroll img{
height:160px;
margin:10px;
cursor:pointer;
transition:transform 0.5s;
}

.scroll img:hover{
transform:scale(1.1);
}

@keyframes scroll{
from{
transform:translateX(0);
}
to{
transform:translateX(-50%);
}
}

/* BOUTIQUE */

.shop{
display:none;
}

.product{
margin:40px;
}

.product img{
width:90%;
max-width:400px;
}

/* INSTAGRAM */

.insta{
width:90px;
margin:40px auto;
animation:breath 3s infinite;
}

@keyframes breath{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

/* VIDEO */

.video{
width:90%;
max-width:400px;
margin:40px auto;
}

.video iframe{
width:100%;
height:500px;
}

/* SIGNATURE */

.signature{
margin:50px;
opacity:0.6;
}

</style>
</head>

<body>

<!-- HAMBURGER -->

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div class="menu" id="menu">

<a href="#" onclick="toggleCreations()">Mes créations</a>

<a href="#" onclick="toggleShop()">Ma boutique</a>

<a href="mailto:ntafforeau@gmail.com">Créer ma boîte</a>

</div>

<!-- LOGO -->

<img src="boxaweedsite/logo.png" class="logo">

<!-- TEXTE -->

<div class="intro">

Créations artisanales uniques et personnalisables

</div>

<!-- BOUTON CREER -->

<button class="button"
onclick="location.href='mailto:ntafforeau@gmail.com'">

Créer ma boîte

</button>

<!-- BOUTON CREATIONS -->

<button class="button"
onclick="toggleCreations()">

Mes créations

</button>

<div class="creations" id="creations"></div>

<!-- BANDE FILANTE -->

<div class="scroll-container">

<div class="scroll" id="scroll"></div>

</div>

<!-- BOUTIQUE -->

<button class="button"
onclick="toggleShop()">

Ma boutique

</button>

<div class="shop" id="shop"></div>

<!-- INSTAGRAM -->

<a href="https://instagram.com" target="_blank">

<img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
class="insta">

</a>

<!-- VIDEO -->

<div class="video">

<iframe
src="https://www.youtube.com/embed/AR4yD9GrbuM"
frameborder="0"
allowfullscreen>
</iframe>

</div>

<!-- SIGNATURE -->

<div class="signature">

Boxaweed 2026

</div>

<script>

/* HAMBURGER */

function toggleMenu(){

let menu=document.getElementById("menu");

menu.style.display=
menu.style.display==="block"
?"none"
:"block";

}

/* CREATIONS */

let creationsLoaded=false;

function toggleCreations(){

let div=document.getElementById("creations");

if(div.style.display==="flex"){

div.style.display="none";

return;

}

div.style.display="flex";

if(!creationsLoaded){

for(let i=1;i<=12;i++){

let img=document.createElement("img");

img.src=`boxaweedsite/creation${i}.jpg`;

img.onclick=()=>window.open(img.src);

div.appendChild(img);

}

creationsLoaded=true;

}

}

/* BANDE FILANTE */

let scroll=document.getElementById("scroll");

for(let i=1;i<=12;i++){

let img=document.createElement("img");

img.src=`boxaweedsite/boite${i}.jpg`;

img.onclick=()=>window.open(img.src);

scroll.appendChild(img);

}

/* duplication pour boucle infinie */

for(let i=1;i<=12;i++){

let img=document.createElement("img");

img.src=`boxaweedsite/boite${i}.jpg`;

img.onclick=()=>window.open(img.src);

scroll.appendChild(img);

}

/* SHOP */

let shopLoaded=false;

function toggleShop(){

let shop=document.getElementById("shop");

if(shop.style.display==="block"){

shop.style.display="none";

return;

}

shop.style.display="block";

if(!shopLoaded){

for(let i=1;i<=12;i++){

let div=document.createElement("div");

div.className="product";

div.innerHTML=`

<img src="boxaweedsite/boite${i}.jpg">

<p>

Boîte artisanale unique<br>

Entièrement personnalisable<br>

Création sur demande<br>

Contact: ntafforeau@gmail.com

</p>

`;

shop.appendChild(div);

}

shopLoaded=true;

}

}

</script>

</body>
</html>
